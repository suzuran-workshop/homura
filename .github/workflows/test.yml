name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Typecheck & Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: homura
          POSTGRES_PASSWORD: homura
          POSTGRES_DB: homura_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U homura"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      minio:
        # MinIO 社区版官方容器分发渠道已全线关闭（Docker Hub 撤库 / quay 转私），
        # 暂用 Bitnami 归档镜像（2025.7.23 版，只读不再更新）；
        # 长期方案：docker-minio.yml 从源码自建 GHCR 镜像，构建并设 public 后
        # 将 image 切为 ghcr.io/suzuran-workshop/minio:latest
        image: bitnamilegacy/minio:2025.7.23-debian-12-r5
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        ports:
          - 9000:9000
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # pg 集成（@homurajs/db pg driver / migrations）
      PG_TEST_URL: postgresql://homura:homura@localhost:5432/homura_test
      # minio 集成（@homurajs/storage s3 后端）
      S3_TEST_ENDPOINT: http://localhost:9000
      S3_TEST_ACCESS_KEY: minioadmin
      S3_TEST_SECRET_KEY: minioadmin

    steps:
      - uses: actions/checkout@v4

      # version 不在此指定：pnpm/action-setup 会读根 package.json 的 packageManager，
      # 两处同时声明会触发 "Multiple versions of pnpm specified" 硬错误
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # 发包一致性（静态校验，无需 build）：package.json 的 publishConfig.exports 声明的每个子路径，
      # 必须在 tsdown.config.ts 的 entry 里有对应项。漏了就是 26.10.14/15 storage ./db 那类事故：
      # 开发态 exports 指向 ./src/*.ts，本地测试与 CI 全绿，但发布产物缺文件 → 消费方 import 即
      # ERR_MODULE_NOT_FOUND。放在 Typecheck 之前，让它成为最便宜的第一道闸门。
      - name: 校验 exports 与 tsdown entry 一致
        run: node scripts/check-package-exports.mjs --verbose

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  template-build:
    name: Template smoke build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 同上：pnpm 版本以根 package.json 的 packageManager 为唯一事实来源
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build template (standalone)
        run: pnpm --filter template-hono-react build

      - name: Build template (qw-pages)
        run: pnpm --filter template-hono-react build:qw-pages
