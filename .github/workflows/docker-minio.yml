name: Docker minio

# 从 MinIO 社区版源码 tag 自建容器镜像并推送 GHCR（fork ver，供应链自管）。
# 首次推送后需在 GitHub → Packages → suzuran-workshop/minio → Package settings
# 将可见性改为 Public（一次性手动操作），随后 test.yml 即可切换使用：
#   image: ghcr.io/suzuran-workshop/minio:latest
# 更新版本：改下方 env.MINIO_RELEASE 后手动触发（workflow_dispatch）。
on:
  push:
    branches: [main]
    paths:
      - 'docker/minio/**'
      - '.github/workflows/docker-minio.yml'
  workflow_dispatch:

env:
  MINIO_RELEASE: RELEASE.2025-10-15T17-29-55Z

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    name: Build & push minio image to GHCR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 准备构建上下文（minio 源码 + 本仓库 Dockerfile）
        run: |
          curl -fsSL "https://github.com/minio/minio/archive/refs/tags/${MINIO_RELEASE}.tar.gz" -o /tmp/minio-src.tgz
          mkdir -p /tmp/buildctx
          tar xzf /tmp/minio-src.tgz -C /tmp/buildctx --strip-components=1
          cp docker/minio/Dockerfile /tmp/buildctx/Dockerfile

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: /tmp/buildctx
          file: /tmp/buildctx/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/minio:${{ env.MINIO_RELEASE }}
            ghcr.io/${{ github.repository_owner }}/minio:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
